<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="assets/vendor/sweetalert/sweetalert.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.css" type="text/css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <title>RO - Problème de Transport</title>
</head>

<body>
  <div class="container">
    <header class="main-header">
      <h1>Problème de Transport B.Hammer et MINITAB</h1>
    </header>

    <div class="main-grid-container">
      <div class="control-panel">
        <div class="control-section">
          <h5>1. Configuration</h5>
          <div class="setup-inputs">
            <div>
              <label for="rows">Sources (lignes)</label>
              <input type="number" class="form-control" id="rows" value="4" min="1" />
            </div>
            <div>
              <label for="cols">Destinations (colonnes)</label>
              <input type="number" class="form-control" id="cols" value="6" min="1" />
            </div>
          </div>
          <div class="setup-buttons">
            <button type="button" id="generate-table" class="btn btn-primary">Générer</button>
            <button type="button" id="generate-random" class="btn btn-secondary">Aléatoire</button>
            
            <button type="button" id="generate-example" class="btn btn-secondary">Exemple (4×6)</button>
          </div>
        </div>

        <div class="control-section">
          <h5>2. Résolution</h5>
          <label for="method">Méthode de départ</label>
          <select class="form-control method" id="method">
            <option value="2">Balas Hammer</option>
            <option value="5">MINITAB</option>
          </select>
        </div>

        <div class="solve-button-container">
          <button type="button" class="submit btn btn-solve">Lancer la Résolution</button>
        </div>
      </div>

      <div class="data-panel">
        <div class="table-container">
          <table class="table table-bordered">
            <thead class="head-id"></thead>
            <tbody class="body-id"></tbody>
            <tfoot class="foot-id"></tfoot>
          </table>
        </div>
        <div id="final-solution-container" class="hide">
          <!-- Le tableau de la solution finale sera injecté ici -->
        </div>
        <div class="solution-cost-container">
          <div class="solution-cost"></div>
        </div>
      </div>
    </div>
  </div>
  <!-- Section des résultats détaillés -->
  <div class="container resultat-to-hide hide">
    <div class="results-container">
      <header class="results-header">
        <h3>Étapes de la Résolution</h3>
      </header>
      <div class="tab-wrapper">
        <ul class="tabs"></ul>
      </div>
      <div class="content-wrapper"></div>
    </div>
  </div>
</body>
<!-- DEBUT PREREQUIS -->

<script type="text/javascript" src="assets/script/fill.js"></script>
<script type="text/javascript" src="assets/script/inc/get.inc.js"></script>

</html>
